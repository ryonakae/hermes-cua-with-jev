[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-cua-with-jev"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0,<2", "pydantic>=2.12,<3", "PyYAML>=6,<7", "jsonschema>=4,<5", "typesafe-sdk==0.7.4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["hermes_cua_with_jev*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
